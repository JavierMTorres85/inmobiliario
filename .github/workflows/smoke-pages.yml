name: Smoke test published dashboard

on:
  deployment_status:
  schedule:
    - cron: "30 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smoke-published-dashboard
  cancel-in-progress: true

jobs:
  smoke:
    if: github.event_name != 'deployment_status' || github.event.deployment_status.state == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TARGET_URL: ${{ github.event.deployment_status.environment_url || 'https://javiermtorres85.github.io/inmobiliario/' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run smoke:pages -- "$TARGET_URL"
