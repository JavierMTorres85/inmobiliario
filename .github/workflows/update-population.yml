name: Update population data

# Ingesta manual de las series anuales oficiales de población:
# INE 2881 (municipios) + Ayuntamiento de Madrid 300557 (distritos y barrios).
# Abre una PR con los datos actualizados; la validación normal de PR hace el resto.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Solo validar y resumir, sin abrir PR"
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-population
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run offline tests first
        run: python -m unittest tests.test_update_population -v

      - name: Download and apply population series
        run: |
          python scripts/update_population.py ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Rebuild manifest and validate
        if: ${{ !inputs.dry_run }}
        run: |
          python scripts/build_manifest.py
          python scripts/build_manifest.py --check
          python scripts/validate_repository.py
          node --check js/dashboard.mjs
          node scripts/check_dashboard.mjs

      - name: Open pull request with the new cut
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet; then
            echo "Sin cambios frente al corte actual; no se abre PR."
            exit 0
          fi
          BRANCH="data/population-$(date -u +%Y%m%d-%H%M)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add data/
          git commit -m "Actualizar series anuales de población (INE 2881 + Ayto 300557)"
          git push origin "$BRANCH"
          gh pr create \
            --title "Actualizar series anuales de población" \
            --body "Ingesta automática de INE 2881 (municipios) y Ayto 300557 (distritos/barrios). Revisa el resumen del job y los diffs de \`data/\` antes de fusionar." \
            --base main --head "$BRANCH"
