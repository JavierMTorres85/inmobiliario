name: Validate repository

on:
  pull_request:
  push:
    branches:
      - main
      - "agent/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-api.txt

      - name: Install Python dependencies
        run: python -m pip install -r requirements-api.txt

      - name: Compile and test Python
        run: |
          python -m compileall -q scripts tests
          python -m unittest discover -s tests -v

      - name: Validate repository data and secret hygiene
        run: |
          python scripts/validate_repository.py
          python scripts/build_manifest.py --check

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate dashboard JavaScript and required controls
        run: |
          node --check js/dashboard.mjs
          node --check scripts/smoke_pages.mjs
          node scripts/check_dashboard.mjs

  preview-smoke:
    # El mismo smoke del sitio publicado, contra un servidor estático local:
    # caza regresiones funcionales ANTES de fusionar, sin esperar al deploy.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - name: Serve the dashboard locally
        run: |
          python3 -m http.server 8080 &
          for i in $(seq 1 20); do curl -sf http://127.0.0.1:8080/index.html >/dev/null && break; sleep 1; done

      - name: Run the smoke suite against the local preview
        run: npm run smoke:pages -- "http://127.0.0.1:8080/"
