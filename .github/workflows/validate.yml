name: Validate repository

on:
  pull_request:
  push:
    branches:
      - main
      - "agent/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-api.txt

      - name: Install Python dependencies
        run: python -m pip install -r requirements-api.txt

      - name: Compile and test Python
        run: |
          python -m compileall -q scripts tests
          python -m unittest discover -s tests -v

      - name: Validate repository data and secret hygiene
        run: |
          python scripts/validate_repository.py
          python scripts/build_manifest.py --check

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate dashboard JavaScript and required controls
        run: |
          node --check js/dashboard.mjs
          node --check scripts/smoke_pages.mjs
          node scripts/check_dashboard.mjs
