L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',{attribution:'&copy; CARTO · INE / Ayto. Madrid',maxZoom:16,subdomains:'abcd'}).addTo(map);
let mLayer=null,dLayer=null;
const level=()=>map.getZoom()<Z_MUNI?'zona':'muni';
// smooth diverging color
function _lp(a,b,t){return Math.round(a+(b-a)*t);}
function _mix(c1,c2,t){return `rgb(${_lp(c1[0],c2[0],t)},${_lp(c1[1],c2[1],t)},${_lp(c1[2],c2[2],t)})`;}
const _RED=[[247,247,247],[253,219,199],[244,165,130],[214,96,77],[178,24,43],[103,0,31]];
const _BLU=[[247,247,247],[209,229,240],[103,169,207],[67,147,195],[33,102,172],[5,48,97]];
function _ramp(s){const arr=s>=0?_RED:_BLU;const a=Math.min(Math.abs(s),1)*(arr.length-1);const i=Math.floor(a);if(i>=arr.length-1)return `rgb(${arr[arr.length-1].join(',')})`;return _mix(arr[i],arr[i+1],a-i);}
function col(v,m,lvl){let hi,lohi,useSqrt=false,pw=0.72;
 if(m==='pct'){hi=(lvl==='zona')?10:18;lohi=(lvl==='zona')?3:4;}else{useSqrt=true;hi=(lvl==='zona')?140000:13000;lohi=(lvl==='zona')?8000:5000;}
 let s; if(v>=0){let t=useSqrt?Math.sqrt(v)/Math.sqrt(hi):Math.pow(Math.min(v/hi,1),pw);s=Math.min(t,1);}else{let t=useSqrt?Math.sqrt(-v)/Math.sqrt(lohi):Math.pow(Math.min(-v/lohi,1),pw);s=-Math.min(t,1);}
 return _ramp(s);}
const mval=d=>metric==='abs'?d.a:d.p;
function styleMuni(f){const c=f.properties.mun_code,d=DATA[c],lvl=level();
 if(!d) return {fillColor:'#333',color:'#222',weight:.4,fillOpacity:.5};
 const rec=lvl==='zona'?ZAGG[d.z]:d; let bd=lvl==='zona'?'#111':'#444',w=lvl==='zona'?0.4:0.7;
 if(simSet&&simSet.has(c)){bd='#2ea043';w=2.6;} if(c===selCode&&!selDist){bd='#ffd400';w=2.8;}
 return {fillColor:col(metric==='abs'?rec.a:rec.p,metric,lvl),color:bd,weight:w,fillOpacity:.88};}
function styleDist(f){const c=String(f.properties.cartodb_id),d=DIST[c];
 if(!d) return {fillColor:'#333',color:'#fff',weight:1,fillOpacity:.5};
 let bd='#fff',w=1.1; if(simSet&&simSet.has(c)){bd='#2ea043';w=2.8;} if(c===selCode&&selDist){bd='#ffd400';w=3;}
 return {fillColor:col(metric==='abs'?d.a:d.p,metric,'muni'),color:bd,weight:w,fillOpacity:.9};}
function tipMuni(f){const d=DATA[f.properties.mun_code];if(!d)return f.properties.mun_code;const za=ZAGG[d.z];
 return `<b>${d.n}</b> &middot; <span style="color:#888">${d.z}</span><br>${d.p20.toLocaleString('es')} &rarr; ${d.p25.toLocaleString('es')}<br><b>${d.a>=0?'+':''}${d.a.toLocaleString('es')} (${d.p>=0?'+':''}${d.p}%)</b><br><i>pincha para la ficha</i>`;}
function tipDist(f){const d=DIST[String(f.properties.cartodb_id)];if(!d)return f.properties.name;
 return `<b>Distrito ${d.n}</b><br>${d.p20.toLocaleString('es')} &rarr; ${d.p25.toLocaleString('es')}<br><b>${d.a>=0?'+':''}${d.a.toLocaleString('es')} (${d.p>=0?'+':''}${d.p}%)</b><br><i>pincha para la ficha</i>`;}

function ord(n){return n+'º';}
function rankOf(arr,item,key){const s=[...arr].sort((a,b)=>b[key]-a[key]);return s.findIndex(x=>x.c===item.c)+1;}
function num(x){return (x>=0?'+':'')+x.toLocaleString('es');}
function openInfo(item,isDist){
 selCode=item.c; selDist=isDist; simSet=null;
 const arr=isDist?DARR:MARR, N=arr.length, tipo=isDist?'distrito':'municipio', univ=isDist?'los 21 distritos':'los 179 municipios';
 const anio=isDist?'2024':'2025', anio0=isDist?'2020':'2020', prev=isDist?'2023':'2024';
 const rPob=rankOf(arr,item,'p25'), rAbs=rankOf(arr,item,'a'), rPct=rankOf(arr,item,'p'), rLa=rankOf(arr,item,'la'), rLp=rankOf(arr,item,'lp');
 const media=5.3, momento = item.lp>(item.p/5)*1.25?'acelerando':(item.lp<(item.p/5)*0.7?'desacelerando':'a ritmo estable');
 const info=document.getElementById('info');
 info.innerHTML=`<div class="hd"><span class="x" onclick="clearSel()">&times;</span><h2>${item.n}</h2><div class="sub">${isDist?'Distrito de Madrid':('Municipio &middot; zona '+item.z)}</div></div>
 <div class="bd">
  <div><span class="big">${item.p25.toLocaleString('es')}</span> hab. (${anio})</div>
  <div><span class="rk">${ord(rPob)}</span> más poblado de ${univ}</div>
  <div class="sec">Crecimiento 2020-${anio} (5 años)</div>
  <div>${num(item.a)} hab &nbsp;·&nbsp; <b>${item.p>=0?'+':''}${item.p}%</b></div>
  <div><span class="rk">${ord(rAbs)}</span> que más población sumó &nbsp;|&nbsp; <span class="rk">${ord(rPct)}</span> que más creció en %</div>
  <div class="sec">Último año (${prev}&rarr;${anio})</div>
  <div>${num(item.la)} hab &nbsp;·&nbsp; <b>${item.lp>=0?'+':''}${item.lp}%</b></div>
  <div><span class="rk">${ord(rLa)}</span> que más sumó este último año &nbsp;|&nbsp; <span class="rk">${ord(rLp)}</span> en %</div>
  <div class="ins">Crece <b>${item.p}%</b> en 5 años, ${item.p>=media?'por encima':'por debajo'} de la media regional (+${media}%). Va <b>${momento}</b> (último año ${item.lp>=0?'+':''}${item.lp}% vs ~${(item.p/5).toFixed(1)}%/año del quinquenio).</div>
  <button class="sim" onclick="showSim()">Mostrar 20 con crecimiento similar (${metric==='abs'?'totales':'%'})</button>
  <div id="simbox"></div>
 </div>`;
 info.style.display='block';
 restyle();
}
function clearSel(){selCode=null;simSet=null;document.getElementById('info').style.display='none';restyle();}
function showSim(){
 const arr=selDist?DARR:MARR; const self=arr.find(x=>x.c===selCode); if(!self)return;
 const v=mval(self);
 const near=arr.filter(x=>x.c!==selCode).map(x=>({x,d:Math.abs(mval(x)-v)})).sort((a,b)=>a.d-b.d).slice(0,20);
 simSet=new Set(near.map(o=>o.x.c));
 const unit=metric==='abs'?' hab':'%';
 let html='<div class="clr" style="text-align:center;color:#2ea043;font-weight:bold;margin-top:8px">20 con crecimiento '+(metric==='abs'?'(en total)':'(en %)')+' similar</div><div class="simlist">';
 near.forEach(o=>{const val=metric==='abs'?num(o.x.a):((o.x.p>=0?'+':'')+o.x.p+'%'); html+=`<div><span>${o.x.n}</span><span class="g">${val}</span></div>`;});
 html+='</div><button class="clr" onclick="hideSim()">Quitar resaltado</button>';
 document.getElementById('simbox').innerHTML=html;
 restyle(); fitSim();
}
function hideSim(){simSet=null;document.getElementById('simbox').innerHTML='';restyle();}
function fitSim(){ if(!simSet)return; const lyr=selDist?dLayer:mLayer; if(!lyr)return; const b=[]; lyr.eachLayer(l=>{const c=selDist?String(l.feature.properties.cartodb_id):l.feature.properties.mun_code; if(simSet.has(c)||c===selCode){try{b.push(l.getBounds());}catch(e){}}}); if(b.length){let bb=b[0];for(let i=1;i<b.length;i++)bb=bb.extend(b[i]); map.fitBounds(bb,{padding:[40,40],maxZoom:12});} }

function resetStyles(){ if(mLayer) mLayer.setStyle(styleMuni); if(dLayer&&map.hasLayer(dLayer)) dLayer.setStyle(styleDist); }
function hl(f,l){ if(simSet||selCode) return; const d=DATA[f.properties.mun_code]; if(!d) return;
 if(level()==='zona'&&mLayer){ mLayer.eachLayer(ly=>{ const dd=DATA[ly.feature.properties.mun_code]; if(dd&&dd.z===d.z){ ly.setStyle({color:'#ffffff',weight:2.2}); ly.bringToFront(); }}); }
 else { l.setStyle({color:'#ffffff',weight:2.2}); l.bringToFront(); } }
function restyle(){
 if(mLayer) mLayer.setStyle(styleMuni);
 if(dLayer){ dLayer.setStyle(styleDist);
   if(map.getZoom()>=Z_DIST){ if(!map.hasLayer(dLayer)) dLayer.addTo(map); dLayer.bringToFront(); }
   else if(map.hasLayer(dLayer)) map.removeLayer(dLayer);
 }
 const lvl=level(); let txt=lvl==='zona'?'zonas (agregado)':'municipios (detalle)';
 if(map.getZoom()>=Z_DIST) txt='municipios + distritos de Madrid';
 document.getElementById('lvl').textContent='Nivel: '+txt; legend();
}
async function loadMuni(){let feats=[];
 try{for(const off of [0,100]){const r=await fetch(GEO(off));const j=await r.json();(j.results||[]).forEach(x=>{if(x.geo_shape){const g=x.geo_shape.geometry||x.geo_shape;feats.push({type:'Feature',properties:{mun_code:x.mun_code},geometry:g});}});}}
 catch(e){document.getElementById('load').textContent='Error geometría: '+e;return;}
 mLayer=L.geoJSON({type:'FeatureCollection',features:feats},{style:styleMuni,onEachFeature:(f,l)=>{l.bindTooltip(tipMuni(f),{className:'mt',sticky:true});l.on('mouseover',()=>hl(f,l));l.on('mouseout',resetStyles);l.on('click',()=>{const d=DATA[f.properties.mun_code];if(d)openInfo(Object.assign({c:f.properties.mun_code},d),false);});}}).addTo(map);
 restyle();
}
async function loadDist(){try{const r=await fetch(GEO_DIST);const gj=await r.json();
 dLayer=L.geoJSON(gj,{style:styleDist,onEachFeature:(f,l)=>{l.bindTooltip(tipDist(f),{className:'mt',sticky:true});l.on('mouseover',()=>{if(simSet||selCode)return;l.setStyle({color:'#fff',weight:2.6});l.bringToFront();});l.on('mouseout',resetStyles);l.on('click',()=>{const c=String(f.properties.cartodb_id),d=DIST[c];if(d)openInfo(Object.assign({c},d),true);});}});
 restyle();}catch(e){}}
map.on('zoomend',restyle);
document.getElementById('bAbs').onclick=()=>{metric='abs';sw();};
document.getElementById('bPct').onclick=()=>{metric='pct';sw();};
function sw(){document.getElementById('bAbs').classList.toggle('on',metric==='abs');document.getElementById('bPct').classList.toggle('on',metric==='pct');if(selCode){const arr=selDist?DARR:MARR;const it=arr.find(x=>x.c===selCode);if(it)openInfo(it,selDist);}restyle();}
let lg;
function legend(){if(lg)lg.remove();lg=L.control({position:'bottomright'});
 lg.onAdd=function(){const div=L.DomUtil.create('div','legend');
  const g='linear-gradient(to right,rgb(5,48,97),rgb(67,147,195),rgb(247,247,247),rgb(244,165,130),rgb(178,24,43),rgb(103,0,31))';
  const hi=metric==='pct'?(level()==='zona'?'+10%':'+18%'):(level()==='zona'?'+140 mil':'+13 mil');
  const lo=metric==='pct'?(level()==='zona'?'-3%':'-4%'):(level()==='zona'?'-8 mil':'-5 mil');
  div.innerHTML='<b>'+(metric==='pct'?'Δ % población':'Δ personas')+'</b>'
   +'<div style="height:11px;width:170px;background:'+g+';border:1px solid #888;margin:4px 0;border-radius:2px"></div>'
   +'<div style="display:flex;justify-content:space-between;width:170px;color:#555"><span>'+lo+'</span><span>0</span><span>'+hi+'</span></div>'
   +'<div style="color:#888;margin-top:2px">rojo=gana · azul=pierde · <span style="color:#2ea043">verde=similar</span></div>';
  return div;};
 lg.addTo(map);}
loadMuni().then(()=>{document.getElementById('load').style.display='none';}); loadDist();
</script></body></html>
