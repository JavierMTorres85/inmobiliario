<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mercado de vivienda CdM — panel interactivo</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css"/>
<script src="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
<style>
 html,body{margin:0;height:100%;font-family:Arial,Helvetica,sans-serif}
 #map{position:absolute;inset:0;background:#0b0b0b}
 .panel{position:absolute;top:10px;left:52px;z-index:1000;background:rgba(255,255,255,.96);padding:9px 12px;border-radius:7px;box-shadow:0 1px 5px rgba(0,0,0,.35);max-width:360px}.panel-head{display:flex;align-items:center;justify-content:space-between;gap:8px}.panel-body{display:block}
 .panel h1{font-size:14px;margin:0 0 4px}.panel-toggle{display:none;border:0;border-radius:5px;background:#1F4E78;color:#fff;font-weight:bold;padding:7px 10px}.panel p{font-size:11px;margin:0 0 8px;color:#555}
 .tabs{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:6px}
 .tabs button{border:1px solid #1F4E78;background:#fff;color:#1F4E78;padding:4px 8px;border-radius:5px;cursor:pointer;font-size:11.5px}
 .tabs button.on{background:#1F4E78;color:#fff;font-weight:bold}
 .seg{display:flex;border:1px solid #b2182b;border-radius:6px;overflow:hidden;font-size:12px}
 .seg button{flex:1;border:0;background:#fff;color:#b2182b;padding:5px 8px;cursor:pointer}
 .seg button.on{background:#b2182b;color:#fff;font-weight:bold}
 .lvl{font-size:11px;color:#777;margin-top:6px}
 .metric-select{display:none;font-size:11px;color:#555}.metric-select select{width:100%;margin-top:3px;border:1px solid #1F4E78;border-radius:6px;background:#fff;padding:8px;font-size:14px}
 .legend{position:absolute;right:10px;bottom:28px;z-index:900;background:rgba(255,255,255,.95);padding:8px 10px;border-radius:6px;font-size:11px;line-height:16px;box-shadow:0 1px 5px rgba(0,0,0,.35)}
 .legend b{font-size:12px}
 .legend-ranges{display:grid;gap:3px;margin-top:5px}.legend-range{display:grid;grid-template-columns:18px 1fr auto;align-items:center;gap:5px;border:1px solid #bbb;background:#fff;color:#333;border-radius:4px;padding:3px 5px;cursor:pointer;text-align:left;font-size:10.5px}.legend-range:hover,.legend-range.active{border-color:#007f9e;box-shadow:0 0 0 2px rgba(0,174,214,.25)}.legend-range .swatch{width:16px;height:10px;border-radius:2px}.legend-range .count{font-weight:bold;color:#007f9e}.legend-actions{display:flex;gap:4px;margin-top:5px}.legend-actions button{border:1px solid #777;background:#fff;border-radius:4px;padding:4px 6px;cursor:pointer;font-size:10px}.legend-note{color:#666;margin-top:3px}.legend-selected{color:#007f9e;font-weight:bold}
 .info{position:absolute;top:10px;right:10px;width:305px;max-height:calc(100% - 20px);overflow:auto;z-index:1001;background:#fff;border-radius:8px;box-shadow:0 2px 10px rgba(0,0,0,.4);display:none}
 .info .hd{background:#1F4E78;color:#fff;padding:10px 12px;border-radius:8px 8px 0 0;position:relative}
 .info .hd h2{margin:0;font-size:15px} .info .hd .sub{font-size:11px;opacity:.85}
 .info .x{position:absolute;top:5px;right:7px;cursor:pointer;font-size:20px;color:#fff;background:transparent;border:0;padding:2px 6px}
 .info .bd{padding:11px 13px;font-size:12.5px;line-height:1.5;color:#222}
 .info .big{font-size:19px;font-weight:bold} .info .rk{color:#1F4E78;font-weight:bold}
 .info .sec{margin:9px 0 3px;font-weight:bold;color:#444;border-top:1px solid #eee;padding-top:7px}
 .info .ins{background:#f3f7fb;border-left:3px solid #1F4E78;padding:6px 8px;margin-top:8px;font-size:12px;color:#333}
 .info button.sim{margin-top:10px;width:100%;background:#2ea043;color:#fff;border:0;padding:7px;border-radius:6px;cursor:pointer;font-size:12.5px;font-weight:bold}
 .info button.clr{margin-top:6px;width:100%;background:#eee;color:#333;border:0;padding:6px;border-radius:6px;cursor:pointer;font-size:12px}
 .simlist{margin-top:8px;font-size:11.5px} .simlist div{display:flex;justify-content:space-between;padding:2px 0;border-bottom:1px solid #f0f0f0}
 .simlist .g{color:#2ea043;font-weight:bold}
 .spark{display:flex;align-items:flex-end;gap:3px;height:44px;margin:6px 0 2px}
 .spark div{flex:1;background:#1F4E78;border-radius:2px 2px 0 0;position:relative;min-height:3px}
 .spark span{position:absolute;bottom:-15px;left:0;right:0;text-align:center;font-size:9px;color:#777}
 .sparkbox{margin-bottom:16px}
 .maplibregl-popup-content{font-size:12px;line-height:15px;padding:8px 10px}.maplibregl-popup-close-button{display:none}
 .lbl{color:#fff;font:bold 10px Arial;text-shadow:0 1px 3px #000,0 -1px 3px #000,1px 0 3px #000,-1px 0 3px #000,0 0 5px #000;pointer-events:none;white-space:nowrap;position:absolute;transform:translate(-50%,-50%)}
 .loading{position:absolute;bottom:14px;left:52px;color:#bbb;font-size:11px;z-index:900}
 .warnings{position:absolute;bottom:14px;left:52px;max-width:520px;background:rgba(120,35,25,.95);color:#fff;padding:7px 10px;border-radius:6px;font-size:11px;z-index:1002;display:none}
 .more-actions{margin-top:7px;font-size:11px}.more-actions summary{cursor:pointer;color:#1F4E78;font-weight:bold}.share{display:flex;align-items:center;gap:7px;margin-top:7px}
 .share button,.compare button{border:0;border-radius:5px;padding:6px 9px;cursor:pointer;font-weight:bold}
 .share button{background:#1F4E78;color:#fff;font-size:11.5px}.share span{font-size:10.5px;color:#287a3e}
 .tools{display:grid;grid-template-columns:1fr;gap:6px;margin-top:7px}.tools label{font-size:10px;color:#555}.tools input{box-sizing:border-box;width:100%;margin-top:2px;border:1px solid #777;border-radius:5px;padding:6px 7px;font-size:11.5px}
 .quality{margin-top:10px;padding:7px 8px;background:#fff8e6;border:1px solid #e2c978;border-radius:6px;font-size:11px;line-height:1.45}.quality summary{cursor:pointer;font-weight:bold;color:#6b4d00}.quality .quality-details{padding-top:5px}
 .changes{margin-top:9px;border:1px solid #ddd;border-radius:6px;padding:8px}.changes h3{font-size:11.5px;margin:0 0 6px}.change-pair{display:grid;grid-template-columns:1fr 1fr;gap:6px}.change-pair div{border-radius:5px;padding:7px}.change-pair .old{background:#e6f0fb;border:1px solid #3978b5;color:#164b7d}.change-pair .new{background:#fff0df;border:1px solid #d96f00;color:#7c3b00}.change-pair strong{display:block;font-size:15px}.changes .note{font-size:10.5px;color:#666;margin-top:5px}
 .info button.compare-add{margin-top:7px;width:100%;background:#7253a3;color:#fff;border:0;padding:7px;border-radius:6px;cursor:pointer;font-size:12.5px;font-weight:bold}
 .compare{position:absolute;left:52px;bottom:14px;width:min(650px,calc(100% - 420px));z-index:1001;background:#fff;border-radius:8px;box-shadow:0 2px 10px rgba(0,0,0,.4);display:none;overflow:hidden}
 .compare .chd{display:flex;align-items:center;justify-content:space-between;background:#7253a3;color:#fff;padding:8px 11px}
 .compare .chd h2{font-size:14px;margin:0}.compare .chd button{background:transparent;color:#fff;font-size:19px;padding:0 5px}
 .compare .cbd{padding:9px 11px;font-size:11.5px;overflow:auto}.compare table{width:100%;border-collapse:collapse}.compare th,.compare td{text-align:left;padding:5px;border-bottom:1px solid #eee}.compare th{color:#555}.compare .empty{color:#666}.compare .actions{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px}.compare .actions button{background:#eee;color:#333}.compare .actions button.export{background:#1F4E78;color:#fff}
 .comparability{padding:7px 9px;border-radius:6px;margin-bottom:8px;font-size:11px}.comparability.high{background:#e7f6eb;border-left:4px solid #2e8b45}.comparability.medium{background:#fff5d8;border-left:4px solid #c68a00}.comparability.low{background:#fde8e6;border-left:4px solid #b23b32}.comparability b{display:block}
 .sheet-toggle{display:none}.panel button,.panel input,.panel select,.info button,.compare button{min-height:36px}button:focus-visible,.maplibregl-canvas:focus-visible{outline:3px solid #ffd400;outline-offset:2px}
 @media (max-width:760px){
  .panel{top:max(6px,env(safe-area-inset-top));left:6px;right:6px;max-width:none;padding:8px}.panel h1{margin:0;font-size:13px}.panel-toggle{display:block;min-height:44px}.panel-body{display:none;padding-top:7px}.panel.open .panel-body{display:block}.panel p,.tabs{display:none}.metric-select{display:block}.seg button,.panel input,.panel select,.panel button{min-height:44px}.tools{grid-template-columns:1fr}.more-actions{margin-top:8px}
  .info{top:auto;left:6px;right:6px;bottom:max(6px,env(safe-area-inset-bottom));width:auto;max-height:44%;border-radius:12px}.info.expanded{max-height:82%}.info .hd{position:sticky;top:0;z-index:1;padding-left:48px}.sheet-toggle{display:block;position:absolute;left:7px;top:6px;width:34px;min-height:34px;border:0;background:rgba(255,255,255,.2);color:#fff;border-radius:5px;font-size:16px}.info button{min-height:44px}
  .compare{left:6px;right:6px;bottom:max(6px,env(safe-area-inset-bottom));width:auto;max-height:58%}.legend{display:block;right:6px;bottom:28px;max-width:calc(100vw - 32px);padding:6px 8px;font-size:10px;line-height:14px}.legend div{max-width:180px}.legend-range,.legend-actions button{min-height:36px}.maplibregl-ctrl-top-left{display:none}.loading,.warnings{left:6px;right:6px;bottom:6px;max-width:none}
 }
 @media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style></head><body>
<div class="panel" id="controlPanel">
 <div class="panel-head"><h1>Mercado de vivienda — Comunidad de Madrid</h1><button type="button" class="panel-toggle" id="togglePanel" aria-expanded="false" aria-controls="panelBody">Opciones</button></div>
 <div class="panel-body" id="panelBody">
 <div class="tabs" role="group" aria-label="Métrica del mapa">
  <button type="button" id="tpob" class="on" data-metric="pob" aria-pressed="true">Población</button>
  <button type="button" id="tpre" data-metric="pre" aria-pressed="false">Precio €/m²</button>
  <button type="button" id="tren" data-metric="ren" aria-pressed="false">Rentabilidad</button>
  <button type="button" id="tesf" data-metric="esf" aria-pressed="false">Esfuerzo</button>
  <button type="button" id="tten" data-metric="ten" aria-pressed="false">Demanda-precio</button>
 </div>
 <label class="metric-select" for="metricSelect">Métrica<select id="metricSelect"><option value="pob">Población</option><option value="pre">Precio €/m²</option><option value="ren">Rentabilidad</option><option value="esf">Esfuerzo</option><option value="ten">Demanda-precio</option></select></label>
 <p id="mdesc">Crecimiento anual equivalente: municipios 2020-2025; distritos y barrios 2020-2024. Rojo = gana · Azul = pierde. <b>Pincha</b> para la ficha.</p>
 <div class="seg" id="segpob" role="group" aria-label="Unidad de población"><button type="button" id="bAbs" aria-pressed="false">Cambio total</button><button type="button" id="bPct" class="on" aria-pressed="true">Crecimiento anual (%)</button></div>
 <div class="lvl" id="lvl">Nivel: municipios</div>
 <div class="tools">
  <label for="zoneSearch">Buscar municipio, distrito o barrio<input id="zoneSearch" list="zoneOptions" autocomplete="off" placeholder="Ej.: Boadilla, Centro…"></label>
  <datalist id="zoneOptions"></datalist>
 </div>
 <details class="more-actions"><summary>Más opciones</summary><div class="share"><button type="button" id="share">Copiar enlace de esta vista</button><span id="shareStatus" role="status" aria-live="polite"></span></div></details>
 </div>
</div>
<aside class="info" id="info" aria-label="Ficha de la zona" aria-live="polite"></aside>
<aside class="compare" id="compare" aria-label="Comparador de zonas">
 <div class="chd"><h2>Comparador de dos zonas</h2><button type="button" id="closeCompare" aria-label="Cerrar comparador">&times;</button></div>
 <div class="cbd" id="compareBody"></div>
</aside>
<div class="loading" id="load">Cargando geometría…</div>
<div class="warnings" id="warnings" role="status" aria-live="polite"></div>
<div class="legend" id="mapLegend" aria-label="Leyenda del mapa"></div>
<div id="map" role="region" aria-label="Mapa interactivo del mercado de vivienda de la Comunidad de Madrid"></div>
<script type="module" src="js/dashboard.mjs?v=4.1.1"></script></body></html>
